<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProspectVault · 秋招投递与公司研究</title>
<style>
:root{
  --bg:#f2f5f9;--card:#ffffff;--line:#e2e8f0;--line2:#eef2f7;
  --tx:#1e293b;--tx2:#5b6b81;--tx3:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-d:#1d4ed8;
  --green:#0e9f6e;--green-l:#e8f7f0;--red:#e11d48;--red-l:#fdecef;
  --amber:#d97706;--amber-l:#fdf3e3;--purple:#7c3aed;--purple-l:#f2ebfe;
  --indigo:#4f46e5;--slate:#64748b;--slate-l:#eef1f5;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 12px 32px -8px rgba(16,24,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx)}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}

/* ---------- 左侧栏 ---------- */
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.sb-brand{padding:18px 16px;border-bottom:1px solid var(--line)}
.sb-brand .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.sb-brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.sb-brand small{font-weight:500;color:var(--tx3);font-size:10px;display:block;margin-top:1px}
.sb-nav{padding:12px 8px}
.sb-tabs{display:flex;flex-direction:column;gap:2px}
.sb-tab{padding:9px 12px;border:none;background:transparent;border-radius:9px;color:var(--tx2);font-weight:500;font-size:13.5px;text-align:left;transition:.15s;display:flex;align-items:center;gap:8px;position:relative}
.sb-tab:hover{background:#eef2ff;color:var(--blue)}
.sb-tab.active{background:var(--blue);color:#fff}
.sb-tab .cnt{font-size:10px;background:rgba(0,0,0,.12);border-radius:20px;padding:1px 6px;margin-left:auto}
.sb-tab.active .cnt{background:rgba(255,255,255,.25)}
.sb-actions{padding:12px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sb-btn{padding:8px 12px;border:none;background:transparent;border-radius:8px;color:var(--tx2);font-size:12.5px;text-align:left;transition:.12s;display:flex;align-items:center;gap:8px}
.sb-btn:hover{background:#f1f5f9;color:var(--tx)}
.sb-btn.primary{background:var(--blue);color:#fff;font-weight:600}
.sb-btn.primary:hover{background:var(--blue-d)}
.sb-ind{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);padding:6px 12px}
.sb-ind .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* ---------- 主内容区 ---------- */
main{margin-left:240px;padding:20px 24px 60px;max-width:1280px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--tx);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#fecdd3}
.btn.danger:hover{background:var(--red-l)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.store-ind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);background:#f8fafc;border:1px solid var(--line);padding:4px 9px;border-radius:30px;white-space:nowrap}
.store-ind .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.store-ind.warn .dot{background:var(--amber)}
.store-ind.bad .dot{background:var(--red)}

/* ---------- layout ---------- */
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:20px;font-weight:700}
.page-head .sub{color:var(--tx2);font-size:12.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

/* ---------- dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:var(--r);padding:15px 16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.stat.kpi{padding:18px 16px}
.kpi-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.kpi-body{flex:1;min-width:0}
.stat .k{font-size:12px;color:var(--tx2)}
.stat .v{font-size:27px;font-weight:800;line-height:1.25;margin-top:3px}
.stat .s{font-size:11px;color:var(--tx3);margin-top:2px}
.stat .bar{position:absolute;left:0;right:0;bottom:0;height:3px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.panel{padding:16px}
.panel h3{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .more{margin-left:auto;font-size:12px;font-weight:500;color:var(--blue);cursor:pointer}
.alert-total{font-size:11px;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:20px;font-weight:600}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.12s;border-bottom:1px solid var(--line2)}
.alert-item:last-child{border-bottom:none}
.alert-item:hover{background:var(--blue-l)}
.alert-item .d{flex:1;min-width:0}
.alert-item .co{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-item .po{color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.alert-badge.amber{background:#fdf3e3;color:#d97706}
.alert-badge.blue{background:#eff6ff;color:#2563eb}
.remind-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.12s;border-bottom:1px solid var(--line2)}
.remind-item:last-child{border-bottom:none}
.remind-item:hover{background:var(--blue-l)}
.remind-item .d{flex:1;min-width:0}
.remind-item .co{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remind-item .po{color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pri-高{background:var(--red-l);color:var(--red)}
.pri-中{background:var(--amber-l);color:var(--amber)}
.pri-低{background:var(--blue-l);color:var(--blue)}
.st-未投递{background:var(--slate-l);color:var(--slate)}
.st-网申中{background:#e8f1fd;color:#1d6fd6}
.st-简历筛选{background:#e9e8fd;color:#5447d8}
.st-笔试{background:var(--purple-l);color:var(--purple)}
.st-面试{background:var(--amber-l);color:var(--amber)}
.st-Offer{background:var(--green-l);color:var(--green)}
.st-已拒{background:var(--red-l);color:var(--red)}
.dl-over{color:var(--red)!important}
.dl-soon{color:var(--amber)!important;font-weight:700}
.dl-ok{color:var(--tx3)}
.dl-chip{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:#f1f5f9}
/* ---------- 竞争力指标 ---------- */
.compete-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:600;background:#f8fafc;border:1px solid var(--line)}
.compete-score{font-size:16px;font-weight:800}
.compete-label{font-size:11px}
.compete-high{background:#e8f7f0;border-color:#b6e3cf;color:#0e9f6e}
.compete-mid{background:#fdf3e3;border-color:#fed7aa;color:#d97706}
.compete-low{background:#fdecef;border-color:#fbc4cc;color:#e11d48}
.compete-bar{width:80px;height:8px;border-radius:4px;background:#e8edf3;overflow:hidden;display:inline-block}
.compete-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn-row{display:flex;align-items:center;gap:10px}
.fn-label{width:74px;font-size:12px;color:var(--tx2);text-align:right;flex-shrink:0}
.fn-track{flex:1;height:20px;background:#f1f5f9;border-radius:5px;position:relative;overflow:hidden}
.fn-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .4s}
.fn-num{width:40px;font-size:12.5px;font-weight:700;flex-shrink:0}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.dist-row .nm{width:64px;font-size:12px;color:var(--tx2)}
.dist-track{flex:1;height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.dist-fill{height:100%;border-radius:6px}
.dist-row .nu{width:30px;text-align:right;font-weight:700;font-size:12.5px}
.act-item{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line2);align-items:center}
.act-item:last-child{border-bottom:none}
.act-item .t{font-size:12px;color:var(--tx3);flex-shrink:0;width:66px}
.act-item .m{flex:1;min-width:0;font-size:13px}
.act-item .m b{font-weight:600}
.act-item .m span{color:var(--tx2)}

/* ---------- table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search:before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.7}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff}
.filter-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--tx2);transition:.12s}
.filter-btn.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:600}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:920px}
.tbl th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px 12px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
.tbl th:hover{color:var(--blue)}
.tbl th .ar{font-size:10px;opacity:.55}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#f8fafc}
.tbl tbody tr.row-click{cursor:pointer}
.co{font-weight:600}
.po{color:var(--tx2);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-wrap{display:flex;align-items:center;gap:6px}
.mt-bar{width:54px;height:6px;border-radius:3px;background:#e8edf3;overflow:hidden;display:inline-block}
.mt-bar i{display:block;height:100%;border-radius:3px}
.num-b{font-weight:800}
.op-btn{border:none;background:transparent;font-size:16px;padding:3px 5px;border-radius:6px;color:var(--tx3);transition:.12s}
.op-btn:hover{background:#f1f5f9;color:var(--blue)}
.op-btn.del:hover{background:var(--red-l);color:var(--red)}
.sel-status{border:1px solid transparent;border-radius:7px;padding:3px 6px;font-size:12.5px;font-weight:600;background:transparent;outline:none;cursor:pointer}
.sel-status:hover{border-color:var(--line)}
.empty{padding:46px 16px;text-align:center;color:var(--tx3)}
.empty .ic{font-size:34px;margin-bottom:8px}
.empty .t{font-weight:600;color:var(--tx2);font-size:14px;margin-bottom:4px}

/* ---------- board ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.bcol{flex:0 0 218px;border-radius:var(--r);background:#eef1f6;padding:8px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.bcol-h{display:flex;align-items:center;gap:6px;padding:2px 6px 8px;font-size:13px;font-weight:700}
.bcol-h .n{background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:0 7px;color:var(--tx2)}
.bcol-h .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bcards{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:60px;padding-bottom:4px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:grab;box-shadow:var(--sh);transition:.12s;user-select:none}
.bcard:hover{border-color:#c7d2fe;box-shadow:var(--sh2)}
.bcard .co{font-weight:700;font-size:13px}
.bcard .po{font-size:11.5px;color:var(--tx2);margin:1px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.bcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.bcard .ft .dl{font-size:11px}
.bcol.drag-over{outline:2px dashed var(--blue);outline-offset:-2px;background:#e8f1ff}

/* ---------- interviews ---------- */
.iv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.iv-card{padding:15px;cursor:pointer;transition:.15s}
.iv-card:hover{border-color:#c7d2fe;box-shadow:var(--sh2)}
.iv-top{display:flex;justify-content:space-between;gap:10px}
.iv-score{text-align:center;flex-shrink:0}
.iv-score .n{font-size:23px;font-weight:800;line-height:1.1}
.iv-score .l{font-size:10.5px;color:var(--tx3)}
.rounds{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.round{font-size:12px;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
.round .rh{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.round .rd{color:var(--tx3);font-size:11px;font-weight:400}
.round .rn{margin-top:3px;color:var(--tx2);font-size:11.5px;line-height:1.45}
.round.pass{border-color:#b6e3cf;background:var(--green-l)}
.round.fail{border-color:#fbc4cc;background:var(--red-l)}
.pod{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pod-c{flex:1;min-width:190px;border-radius:12px;padding:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);position:relative}
.pod-c .rk{position:absolute;top:-9px;left:12px;font-size:18px}
.pod-c .co{font-weight:700;font-size:15px}
.pod-c .sc{font-size:22px;font-weight:800;margin-top:2px}
.pod-c .meta{color:var(--tx2);font-size:12px;margin-top:2px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;backdrop-filter:blur(2px)}
.mask.open{display:flex}
.dialog{background:#fff;border-radius:16px;width:100%;max-width:860px;box-shadow:var(--sh2);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.dlg-h h3{font-size:16.5px;font-weight:700}
.x{width:30px;height:30px;border:none;background:transparent;border-radius:8px;font-size:17px;color:var(--tx2)}
.x:hover{background:#f1f5f9}
.dlg-b{padding:18px 20px;max-height:calc(100vh - 160px);overflow:auto}
.dlg-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.sec{font-size:13px;font-weight:700;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:0}
.fg{margin-bottom:11px}
.fl{font-size:11.5px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.fi{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;transition:border .12s}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea.fi{resize:vertical;min-height:64px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.iv-box{border:1px solid var(--line2);background:#fbfcfe;border-radius:10px;padding:11px;margin-bottom:9px}
.iv-box .iv-ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.iv-box .iv-ttl b{font-size:12.5px}
.iv-rm{border:none;background:var(--red-l);color:var(--red);border-radius:7px;padding:3px 9px;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh2);max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kv{display:flex;gap:8px;font-size:13px;padding:5px 0}
.kv .k{color:var(--tx2);flex-shrink:0;width:90px}
.link-row{font-size:12.5px;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea.code{width:100%;min-height:110px;font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical;outline:none}
textarea.code:focus{border-color:var(--blue)}
.hint{font-size:12px;color:var(--tx2);background:#f8fafc;border:1px dashed var(--line);border-radius:9px;padding:9px 12px;line-height:1.6}
.hint b{color:var(--tx)}
.steps{font-size:12.5px;color:var(--tx2);line-height:1.7}
.steps b{color:var(--tx)}
footer{max-width:1280px;margin:0 auto;padding:0 18px 26px;color:var(--tx3);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.warn-banner{margin-bottom:14px;padding:11px 14px;border-radius:11px;font-size:13px;display:flex;gap:9px;align-items:center}
.warn-banner .bx{flex:1}
.seg{display:inline-flex;background:#eef1f6;border-radius:9px;padding:2px}
.seg button{border:none;background:transparent;padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:var(--sh)}
.float-tools{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.fab{width:48px;height:48px;border-radius:50%;border:none;box-shadow:var(--sh2);font-size:20px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center}
.fab.primary{background:var(--blue);color:#fff}
@media(min-width:700px){.fab{display:none}}
/* 移动端：sidebar 折叠成顶部汉堡 + 抽屉 */
.sb-toggle{display:none;position:fixed;top:12px;left:12px;z-index:51;width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);align-items:center;justify-content:center;font-size:18px}
@media(max-width:900px){
  .sb-toggle{display:flex}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh2)}
  main{margin-left:0;padding:14px 10px 80px}
  main>*{max-width:100%}
  .sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39;display:none}
  .sb-overlay.show{display:block}
}

/* ---------- 公司研究页 ---------- */
.r-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.r-pick{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.r-pick:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:var(--sh2)}
.r-pick .co{font-weight:700;font-size:15px;padding-right:60px}
.r-pick .po{color:var(--tx2);font-size:12.5px}
.r-pick .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--tx3);margin-top:4px}
.r-pick .abso{position:absolute;top:12px;right:12px}
.r-detail{display:flex;flex-direction:column;gap:14px}
.r-back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;padding:6px 0}
.r-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);position:relative}
.r-head h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.r-head .meta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--tx2);font-size:12.5px}
.r-head .meta-row span{display:inline-flex;align-items:center;gap:4px}
.r-head .actions-rt{position:absolute;top:18px;right:20px;display:flex;gap:8px}
.r-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.r-sec-h{padding:13px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:#fafbfd}
.r-sec-h .ic{font-size:16px}
.r-sec-h .ti{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:500}
.r-sec-h .btns{display:flex;gap:6px;margin-left:8px}
.r-sec-h .ic-btn{background:transparent;border:none;cursor:pointer;color:var(--tx2);padding:4px 8px;border-radius:6px;font-size:12.5px}
.r-sec-h .ic-btn:hover{background:var(--blue-l);color:var(--blue)}
.r-sec-h .ic-btn.del:hover{background:var(--red-l);color:var(--red)}
.r-sec-b{padding:16px 20px}
.r-txt{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--tx);min-height:30px}
.r-txt.empty{color:var(--tx3);font-style:italic}
.r-txt-area{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;line-height:1.6;resize:vertical}
.r-txt-area:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.r-edit-bar{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.r-list{display:flex;flex-direction:column;gap:8px}
.r-li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;line-height:1.5}
.r-li .idx{color:var(--tx3);font-size:11px;min-width:18px;padding-top:1px}
.r-li .txt{flex:1;white-space:pre-wrap;word-break:break-word}
.r-li .acts{display:flex;gap:2px;flex-shrink:0}
.r-li .acts button{background:transparent;border:none;cursor:pointer;color:var(--tx3);padding:2px 6px;border-radius:5px;font-size:12px}
.r-li .acts button:hover{background:#fff;color:var(--blue)}
.r-li .acts .d:hover{color:var(--red);background:var(--red-l)}
.r-add{display:flex;gap:8px;margin-top:10px}
.r-add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.r-add input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.r-link{color:var(--blue);text-decoration:none;word-break:break-all}
.r-link:hover{text-decoration:underline}
.r-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.r-chip.st-未投递{background:#eef1f5;color:#475569}
.r-chip.st-网申中{background:#e0ecff;color:#1d6fd6}
.r-chip.st-简历筛选{background:#ece9fe;color:#5447d8}
.r-chip.st-笔试{background:#f2ebfe;color:#7c3aed}
.r-chip.st-面试{background:#fdf3e3;color:#d97706}
.r-chip.st-Offer{background:#e8f7f0;color:#0e9f6e}
.r-chip.st-已拒{background:#fdecef;color:#e11d48}
.r-chip.pri-高{background:#fdecef;color:#e11d48}
.r-chip.pri-中{background:#fdf3e3;color:#d97706}
.r-chip.pri-低{background:#eef1f5;color:#64748b}
.r-iv{display:flex;flex-direction:column;gap:10px}
.r-iv-row{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fafbfd}
.r-iv-row .ivh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.r-iv-row .ivh strong{font-size:13.5px}
.r-iv-row .ivh .iv-date{color:var(--tx2);font-size:12px}
.r-iv-row .ivh .iv-score{margin-left:auto;font-weight:700;color:var(--blue)}
.r-iv-row .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-iv-row .fg{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.r-iv-row .fl{font-size:11.5px;color:var(--tx2)}
.r-iv-row .fi{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;width:100%}
.r-iv-row textarea.fi{min-height:50px;resize:vertical}
.r-empty-iv{text-align:center;padding:24px;color:var(--tx3);font-size:13px;background:#f8fafc;border:1px dashed var(--line);border-radius:10px}
/* —— 研究页：岗位列表（一个公司多个岗位在此汇总、独立推进） —— */
.r-pos-list{display:flex;flex-direction:column;gap:10px}
.r-pos{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#f8fafc;border:1px solid var(--line2);border-radius:10px}
.r-pos .grow{flex:1;min-width:0}
.r-pos .pt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-pos .pm{color:var(--tx2);font-size:12.5px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.r-pos .pact{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.r-pos .pact .sel-status{max-width:108px;padding:4px 6px;font-size:12px;border-radius:6px;border:1px solid var(--line)}
.r-pos .pact .op-btn{font-size:13px;padding:3px 7px}
.r-pos-sub{font-size:11px;color:var(--tx3);margin-top:5px;white-space:pre-wrap;line-height:1.5}
.r-add-pos{margin-top:12px;display:flex;justify-content:flex-end}
@media(max-width:700px){
  .r-head h2{font-size:18px}
  .r-sec-b{padding:14px}
  .r-head .actions-rt{position:static;margin-top:10px}
  .r-iv-row .grid2{grid-template-columns:1fr}
  .r-pos{flex-direction:column}
  .r-pos .pact{justify-content:flex-start;width:100%}
}

/* ---------- research report (v2, low-saturation reference style) ---------- */
/* 研究报告 - 决策导向布局 */
.r-report{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px;overflow:hidden}
.r-report-hdr{background:linear-gradient(135deg,#eff6ff 0%,#f0f9ff 100%);padding:18px 20px;border-bottom:1px solid #bfdbfe;display:flex;align-items:flex-start;gap:12px}
.r-report-hdr .r-decision-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#2563eb);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex-shrink:0;margin-top:2px}
.r-report-hdr .r-decision-content{flex:1;min-width:0}
.r-report-hdr h3{font-size:14px;font-weight:600;margin:0 0 6px 0;color:#1e3a8a;display:flex;align-items:center;gap:8px}
.r-report-hdr .r-stars{color:#f59e0b;font-size:16px;letter-spacing:2px}
.r-report-hdr .r-decision-summary{font-size:13px;line-height:1.6;color:#1e40af}
.r-report-hdr .tag{font-size:11px;background:#dbeafe;color:#3b82f6;padding:2px 8px;border-radius:10px;font-weight:500;margin-left:auto;flex-shrink:0}
.r-rpt-grid{display:grid;grid-template-columns:1fr;gap:12px;padding:16px}
.r-rpt-grid>.r-card{border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#fff}
.r-card-h{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:6px}
.r-card-h .ic{font-size:14px;opacity:.7}
.r-card-items-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
@media(max-width:900px){.r-card-items-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.r-card-items-grid{grid-template-columns:1fr}}
.r-card-item{background:#f8fafc;border:1px solid #e8ecf1;border-radius:10px;padding:12px 14px}
.r-card-item:last-child{margin-bottom:0}
.r-card-item .fi{font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;letter-spacing:.3px}
.r-card-item .fc{font-size:13px;line-height:1.7;color:#334155}
.r-card-item .fc ul{margin:0;padding:0 0 0 2px;list-style:none}
.r-card-item .fc ul li{position:relative;padding-left:14px;margin-bottom:4px}
.r-card-item .fc ul li:last-child{margin-bottom:0}
.r-card-item .fc ul li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#94a3b8}
.r-card-item .fc .hl-num{color:#2563eb;font-weight:600}
.r-card-item .fc .hl-money{color:#059669;font-weight:600}
.r-card-item .fc .hl-pos{color:#16a34a;font-weight:600}
.r-card-item .fc .hl-neg{color:#dc2626;font-weight:600}
.r-card-item .fc .hl-neutral{color:#ca8a04;font-weight:600}
.r-card-item .fc .hl-tag{background:#e0f2fe;color:#0369a1;padding:1px 5px;border-radius:4px;font-size:12px;font-weight:600}
/* 净收入瀑布图 */
.r-waterfall{margin-top:10px;padding-top:10px;border-top:1px solid #eef1f5}
.r-wf-title{font-size:12px;font-weight:700;color:#475569;margin-bottom:8px}
.r-wf-bar{display:flex;align-items:stretch;height:28px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.r-wf-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;min-width:36px;transition:width .3s}
.r-wf-seg.wf-gross{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.r-wf-seg.wf-insure{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.r-wf-seg.wf-tax{background:linear-gradient(135deg,#a855f7,#c084fc)}
.r-wf-seg.wf-rent{background:linear-gradient(135deg,#ef4444,#f87171)}
.r-wf-seg.wf-bills{background:linear-gradient(135deg,#64748b,#94a3b8)}
.r-wf-seg.wf-food{background:linear-gradient(135deg,#f97316,#fb923c)}
.r-wf-seg.wf-net{background:linear-gradient(135deg,#10b981,#34d399)}
.r-wf-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:#64748b}
.r-wf-legend span{display:inline-flex;align-items:center;gap:3px}
.r-wf-legend .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.r-wf-result{margin-top:6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.r-wf-result .r-wf-amount{font-size:18px;font-weight:800}
.r-card-src{font-size:10px;color:#94a3b8;margin-top:8px;padding-top:6px;border-top:1px solid #f1f5f9}
.r-radar{display:flex;flex-direction:column;gap:8px}
.r-radar-row{display:flex;align-items:center;gap:8px}
.r-radar-row .lb{width:72px;font-size:11px;color:#64748b;text-align:right;flex-shrink:0;font-weight:500}
.r-radar-row .trk{flex:1;height:10px;background:#eef1f5;border-radius:5px;overflow:hidden}
.r-radar-row .fill{height:100%;border-radius:5px;transition:width .4s}
.r-radar-row .val{width:32px;font-size:11px;font-weight:600;color:#475569;text-align:right;flex-shrink:0}
.r-card.full{grid-column:1/-1}
.r-card.wide-bg{background:#f0f9f7;border-top:none;border-left:none}
.r-card.collapsible .r-card-h{cursor:pointer;user-select:none;margin-bottom:0;padding-bottom:7px;border-bottom:1px solid #eef1f5}
.r-card.collapsible .r-card-h::after{content:'\25BC';margin-left:auto;font-size:9px;color:#94a3b8;transition:transform .2s}
.r-card.collapsible.collapsed .r-card-h::after{transform:rotate(-90deg)}
.r-card.collapsible .r-card-body{overflow:hidden;transition:max-height .25s ease}
.r-card.collapsible.collapsed .r-card-body{max-height:0!important;padding:0;border:none}
.r-radar-row .val.risk-high{color:#10b981}
.r-radar-row .val.risk-mid{color:#f59e0b}
.r-radar-row .val.risk-low{color:#ef4444}

/* ---------- 月度预算可视化（以到手月薪为 100% 基准） ---------- */
.r-budget{margin:10px 0 2px;padding:12px;background:#f8fafc;border:1px solid #e8edf3;border-radius:10px}
.rb-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rb-kpi{background:#fff;border:1px solid #e8edf3;border-radius:8px;padding:8px 6px;text-align:center}
.rb-kpi-l{font-size:10px;color:#64748b;font-weight:600;letter-spacing:.3px}
.rb-kpi-v{font-size:17px;font-weight:800;color:#0f172a;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.rb-kpi-s{font-size:10px;color:#94a3b8;line-height:1.3}
.rb-kpi.k-net .rb-kpi-v{color:#2563eb}
.rb-kpi.k-sur .rb-kpi-v{color:#059669}
.rb-kpi.k-sur.neg .rb-kpi-v{color:#dc2626}
.rb-bar-wrap{position:relative;margin:16px 0 4px}
.rb-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:#eef2f7}
.rb-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;min-width:2px;transition:width .3s}
.rb-seg.hatch{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.rb-netline{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0f172a;border-radius:1px;z-index:2}
.rb-netline::after{content:'\5230\624b';position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;color:#0f172a;font-weight:700;white-space:nowrap}
.rb-scale{display:flex;justify-content:space-between;font-size:9px;color:#94a3b8;margin-bottom:10px}
.rb-list{display:flex;flex-direction:column;gap:5px}
.rb-row{display:flex;align-items:center;gap:8px;font-size:11px}
.rb-ic{width:16px;text-align:center;font-size:12px;flex-shrink:0}
.rb-nm{width:74px;color:#475569;font-weight:600;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-trk{flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}
.rb-trk i{display:block;height:100%;border-radius:4px}
.rb-am{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:#334155;font-weight:600}
.rb-pc{width:40px;text-align:right;color:#94a3b8;font-variant-numeric:tabular-nums}
.rb-row.is-sur .rb-nm,.rb-row.is-sur .rb-am{color:#059669;font-weight:700}
.rb-row.is-over .rb-nm,.rb-row.is-over .rb-am{color:#dc2626;font-weight:700}
.rb-foot{margin-top:10px;padding-top:8px;border-top:1px dashed #dde5ee;font-size:11px;color:#64748b;line-height:1.65}
.rb-foot b{color:#0f172a}
.rb-warn{margin-top:8px;padding:6px 9px;border-radius:6px;background:#fef2f2;color:#b91c1c;font-size:11px;font-weight:600;line-height:1.5}
.rb-ok{margin-top:8px;padding:6px 9px;border-radius:6px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:600;line-height:1.5}

/* ---------- 薪资圆环图 ---------- */
.r-donut-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 8px}
.r-donut-svg{margin-bottom:16px}
.r-donut-legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-bottom:12px}
.r-donut-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#475569}
.r-donut-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.r-donut-label{color:#64748b;min-width:48px}
.r-donut-pct{font-weight:700;color:#334155;min-width:36px;text-align:right}
.r-donut-val{color:#94a3b8;font-size:11px}
.r-donut-summary{font-size:13px;text-align:center;padding-top:10px;border-top:1px solid #e2e8f0;margin-top:4px}

/* ---------- 岗位发现页 ---------- */
.discover-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.discover-tab{padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;background:transparent;border:1px solid transparent;transition:all .15s}
.discover-tab:hover{background:var(--bg-soft)}
.discover-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.discover-tab .badge{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:10px;font-size:11px;background:rgba(255,255,255,.2);font-weight:600}
.discover-tab.active .badge{background:rgba(255,255,255,.3)}
.discover-tab:not(.active) .badge{background:var(--bg-soft);color:var(--text-2)}
.discover-card.saved{opacity:.7;border-left:3px solid #f59e0b}
.discover-card.saved .dc-header{position:relative}
.discover-card.saved::after{content:'📌 备选';position:absolute;top:8px;right:8px;font-size:11px;color:#f59e0b;font-weight:600;background:#fef3c7;padding:2px 8px;border-radius:10px}
.discover-card.deleted{opacity:.4}
.discover-card.deleted:hover{opacity:.7}
.discover-filter{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.discover-filter select,.discover-filter input{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.sort-group{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.sort-label{font-size:12px;color:var(--tx2);white-space:nowrap}
.sort-btn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--card);color:var(--tx2);cursor:pointer;transition:.15s}
.sort-btn:hover{border-color:var(--blue);color:var(--blue)}
.sort-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.discover-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.discover-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;transition:.15s}
.discover-card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.discover-card.added{opacity:.5;pointer-events:none}
.dc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dc-company{font-weight:700;font-size:14px;color:var(--tx)}
.dc-type{font-size:11px;color:var(--tx2);background:var(--slate-l);padding:2px 8px;border-radius:12px}
.dc-position{font-size:13px;color:var(--blue);font-weight:500}

<script>

const LS_KEY='qf_workbench_v2';

const STATUS_COLOR={'未投递':'#64748b','网申中':'#1d6fd6','简历筛选':'#5447d8','笔试':'#7c3aed','面试':'#d97706','Offer':'#0e9f6e','已拒':'#e11d48'};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid=()=>'job_'+Date.now()+'_'+Math.floor(Math.random()*1e4);
const nowISO=()=>new Date().toISOString();
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function daysUntil(ds){if(!ds)return null;const p=String(ds).split('-');const t=new Date(+p[0],+p[1]-1,+p[2]);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return d.getMonth()+1+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes())}
function relTime(iso){if(!iso)return '';const diff=Date.now()-new Date(iso).getTime();const m=Math.floor(diff/60000);if(m<1)return '刚刚';if(m<60)return m+'分钟前';const h=Math.floor(m/60);if(h<24)return h+'小时前';const d=Math.floor(h/24);if(d===1)return '昨天';if(d<30)return d+'天前';return new Date(iso).getMonth()+1+'/'+new Date(iso).getDate()}
function matchColor(s){return s>=80?'#0e9f6e':s>=60?'#d97706':'#e11d48'}
function stColor(s){return STATUS_COLOR[s]||'#64748b'}
function cp(s){return 'st-'+s}

/* ================= 存储（带降级） ================= */
let storeOK=true;
function readLS(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null}catch(e){storeOK=false;return null}}

/* ================= 数据 ================= */
let SEED=null, DATA=null;
function parseSeed(){try{const el=document.getElementById('seed-data');if(!el||!el.textContent.trim())return null;return JSON.parse(el.textContent)}catch(e){console.warn('seed parse fail',e);return null}}
/* ---------- 岗位级工具（投递总表/看板/概览 一律以岗位为单位） ---------- */
const POS_ORDER={'未投递':0,'网申中':1,'简历筛选':2,'笔试':3,'面试':4,'Offer':5,'已拒':-1};
function posIdOf(recId,p,idx){if(p&&p.pid)return p.pid;const t=String((p&&p.title)||'').trim().slice(0,60);return recId+'#'+(t||('p'+(idx+1)))}
function normPos(p,recId,idx){
  if(!p||typeof p!=='object')p={};
  p.title=String(p.title||('岗位 '+(idx+1))).trim();
  p.pid=posIdOf(recId,p,idx);
  if(p.location==null)p.location='';if(p.salary==null)p.salary='';if(p.edu==null)p.edu='';if(p.dept==null)p.dept='';
  p.match=p.match!=null?+p.match:null;
  p.priority=p.priority||'中';p.status=p.status||'未投递';p.applied=!!p.applied;
  p.deadline=p.deadline||'';p.applyDate=p.applyDate||'';
  return p;
}
function positionsOf(rec){
  const ps=Array.isArray(rec.positions)?rec.positions:[];
  if(ps.length)return ps;
  return [{title:rec.position||rec.primary_position||'岗位',location:rec.location||'',salary:rec.salary||'',edu:rec.edu||rec.education||'',dept:'',
    match:rec.matchScore!=null?rec.matchScore:null,priority:rec.priority||'中',status:rec.status||'未投递',applied:!!rec.applied,
    deadline:rec.deadline||'',_virt:true}];
}
function flattenPos(){const out=[];DATA.records.forEach(rec=>{positionsOf(rec).forEach((pos,idx)=>out.push({rec,pos,idx}))});return out}
function posInRec(rec,idx){return (Array.isArray(rec.positions)?rec.positions:[])[idx]||null}
function aggStatus(rec){const ps=positionsOf(rec);let best='未投递';ps.forEach(p=>{if(p.status==='已拒')return;if((POS_ORDER[p.status]??0)>(POS_ORDER[best]??0))best=p.status});return best}
function aggApplied(rec){const ps=positionsOf(rec);return ps.some(p=>p.applied||(p.status&&p.status!=='未投递'))}
/* 保持 record 级汇总字段与岗位一致（供同步码/种子/旧逻辑引用） */
function aggregateRec(rec){
  const ps=positionsOf(rec);
  rec.position=rec.position||(ps[0]&&ps[0].title)||'';
  rec.primary_position=rec.primary_position||rec.position;
  let best=null;ps.forEach(p=>{if(best==null||(p.match!=null&&(best.match==null||p.match>best.match)))best=p});
  rec.matchScore=best&&best.match!=null?best.match:null;
  rec.status=aggStatus(rec);rec.applied=aggApplied(rec);
  let due='';ps.forEach(p=>{if(p.status!=='Offer'&&p.status!=='已拒'&&p.deadline&&(!due||p.deadline<due))due=p.deadline});
  rec.deadline=due;
  rec.priority=ps.some(p=>p.priority==='高')?'高':ps.some(p=>p.priority==='中')?'中':(ps.length?'低':'中');
  const locs=[...new Set(ps.map(p=>p.location).filter(Boolean))];
  if(locs.length)rec.location=locs.join('、');
  return rec;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
/* 合并两份公司记录（lr 目标原地合并，ir 外来）：公司资料/研究取 updatedAt 较新者；
   岗位按 pid 并集、取岗位级 updatedAt 较新者；面试记录按 round+date 去重并集 */
function mergeRec(lr,ir){
  const lu=+new Date(lr.updatedAt||0),iu=+new Date(ir.updatedAt||0);
  const src=iu>lu?ir:lr,other=iu>lu?lr:ir;
  Object.keys(src).forEach(k=>{if(k!=='id'&&k!=='positions'&&k!=='interviewStages')lr[k]=clone(src[k])});
  const mp={};
  positionsOf(other).forEach(p=>{mp[p.pid]=clone(p)});
  positionsOf(src).forEach(p=>{const ex=mp[p.pid];if(!ex||(+new Date(p.updatedAt||0))>(+new Date(ex.updatedAt||0)))mp[p.pid]=clone(p)});
  lr.positions=Object.keys(mp).map(pid=>{const p=mp[pid];return normPos(p,lr.id,0)}).map((p,i)=>(p.pid=posIdOf(lr.id,p,i),p));
  const iv=[],seen={};
  [src,other].forEach(rec=>{(rec.interviewStages||[]).forEach(s=>{const k=(s.round||'')+'|'+(s.date||'');if(!seen[k]){seen[k]=1;iv.push(clone(s))}})});
  lr.interviewStages=iv;
  lr.updatedAt=src.updatedAt||nowISO();
  return aggregateRec(lr);
}
function normRec(r){if(!r.id)r.id=uid();
  if(typeof r.positions==='string'){try{r.positions=JSON.parse(r.positions)}catch(e){r.positions=[]}}
  if(!Array.isArray(r.positions))r.positions=[];
  r.positions=r.positions.map((p,i)=>normPos(p,r.id,i));
  // 防御：数据源可能把数组写成 JSON 字符串（历史 bug），统一还原为数组
  if(typeof r.interviewStages==='string'){try{r.interviewStages=JSON.parse(r.interviewStages)}catch(e){r.interviewStages=[]}}
  r.interviewStages=Array.isArray(r.interviewStages)?r.interviewStages:[];
  r.priority=r.priority||'中';r.status=r.status||'未投递';r.applied=!!r.applied;
  r.position=r.position||r.primary_position||(r.positions[0]&&r.positions[0].title)||'';
  r.research=(r.research&&typeof r.research==='object')?r.research:{};
  ['recent','risks','reverseQuestions','prepMaterials','externalLinks','requests'].forEach(k=>{
    if(typeof r.research[k]==='string'){try{r.research[k]=JSON.parse(r.research[k])}catch(e){r.research[k]=[]}}
    if(!Array.isArray(r.research[k]))r.research[k]=[];
  });
  ['business','team','salary','reviews'].forEach(k=>{if(typeof r.research[k]!=='string')r.research[k]=''});
  const def={business:'',team:'',salary:'',recent:[],risks:[],reverseQuestions:[],prepMaterials:[],externalLinks:[]};
  for(const k in def){if(!Array.isArray(r.research[k])&&typeof def[k]==='object')r.research[k]=def[k];else if(typeof def[k]==='string'&&typeof r.research[k]!=='string')r.research[k]=def[k];else if(Array.isArray(def[k])&&!Array.isArray(r.research[k]))r.research[k]=def[k]}
  return aggregateRec(r)}

  if(!o||typeof o!=='object')o={};
  const d={metadata:o.metadata||{},records:Array.isArray(o.records)?o.records.map(normRec):[],resume:o.resume||null,deletedIds:Array.isArray(o.deletedIds)?o.deletedIds:[],discoveredJobs:Array.isArray(o.discoveredJobs)?o.discoveredJobs:[]};
  if(!d.metadata.created)d.metadata.created=todayStr();
  return d;
}
async function load(){
  SEED=parseSeed();
  
  // 优先尝试从本地服务器加载（磁盘数据，最可靠）
  const srv=await readServer();
  if(srv){
    serverMode=true;
    DATA=normData(srv);
    if(SEED){adoptSeed();}  // 仍可吸收种子增量
    persist(false);
    console.log('[server] 从磁盘加载成功');
    
    // 显示服务器状态指示器
    const indicator=document.getElementById('storeInd');
    if(indicator){
      indicator.innerHTML=`<span style="color:#10b981">✓ 服务器模式</span> · <span id="storeTxt" style="font-size:11px;color:#64748b">自动保存已启用</span>`;
    }
    return;
  }
  
  // 降级到 localStorage（这是开源版的默认且唯一模式，属正常状态，不显示警告）
  let local=readLS();
  const indicator=document.getElementById('storeInd');
  if(indicator&&!document.getElementById('storeTxt')){
    indicator.innerHTML='<span class="dot"></span><span id="storeTxt">已自动保存</span>';
  }
  
  // 首次：无本地 → 直接采用种子（若种子空则是在线空壳，等待导入）
  if(!local){
    DATA=normData(SEED);
    if(SEED){DATA.metadata=SEED.metadata||{};}
    persist(false);
  }else{
    // 数据代际校验：种子 dataGen 与本地不一致（如"20 岗 → 7 司合并"这类结构性变更）→ 以权威种子重置，丢弃过期/不兼容的本地数据
    const sg=SEED&&SEED.metadata?(SEED.metadata.dataGen||''):'';
    const lg=local.metadata?(local.metadata.dataGen||''):'';
    if(sg&&sg!==lg&&Array.isArray(SEED.records)&&SEED.records.length){
      DATA=normData(SEED);DATA.metadata=SEED.metadata||{};persist();
      return;
    }
    DATA=normData(local);
    adoptSeed();
  }
}
/* 合并种子：公司资料/research 以种子为准（仅当种子 updatedAt 更新）；
   岗位按 pid 并集，保留用户在网页里推进的状态与新建的岗位 */
function adoptSeed(){
  if(!SEED||!Array.isArray(SEED.records))return;
  const map={};DATA.records.forEach(r=>map[r.id]=r);
  let changed=false;
  SEED.records.forEach(sr=>{
    if(DATA.deletedIds.includes(sr.id))return;          // 用户删过，不复活
    const lr=map[sr.id];
    if(!lr){DATA.records.push(normRec(clone(sr)));changed=true;return}
    const lu=lr.updatedAt?+new Date(lr.updatedAt):0, su=sr.updatedAt?+new Date(sr.updatedAt):0;
    if(su>lu){mergeRec(lr,sr);changed=true}
    else{
      // 本地较新：仍吸收种子新增的岗位 / 面试轮次
      const beforeP=JSON.stringify(positionsOf(lr).map(p=>p.pid));
      mergeRec(lr,sr);
      if(JSON.stringify(positionsOf(lr).map(p=>p.pid))!==beforeP||JSON.stringify(lr.interviewStages)!==JSON.stringify((lr.interviewStages||[])))changed=true;
    }
  });
  // 简历：本地有就保留，否则采用种子
  if(!DATA.resume&&SEED.resume){DATA.resume=SEED.resume;changed=true}
  // discoveredJobs：总是从种子同步（推荐岗位由 AI 搜索生成，种子是唯一权威源）
  if(Array.isArray(SEED.discoveredJobs)&&SEED.discoveredJobs.length){
    DATA.discoveredJobs=SEED.discoveredJobs.slice();changed=true;
  }
  if(changed)persist();
}

// 检测本地服务器是否可用
async function checkServerMode(){
  try{
    const r=await fetch('http://localhost:8765/api/ping',{method:'GET',signal:AbortSignal.timeout(500)});
    if(r.ok){serverMode=true;console.log('[server] 已连接到本地服务器');return true}
  }catch(e){}
  serverMode=false;return false;
}

// 从服务器读取数据
// 仅当页面本身运行在本地（file:// 或 localhost）时才探测本地同步服务；
// 部署到线上（如 GitHub Pages）时跳过，避免无意义的请求与控制台报错。
// 需要强制开启可加 ?server=1，需要强制关闭可加 ?noserver=1
function serverProbeOK(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('server')==='1')return true;
    if(q.get('noserver')==='1')return false;
    const p=location.protocol,h=location.hostname;
    if(p==='file:')return true;
    return h==='localhost'||h==='127.0.0.1'||h==='0.0.0.0'||h==='[::1]';
  }catch(e){return false}
}
async function readServer(){
  if(!serverProbeOK())return null;
  try{
    const r=await fetch('http://localhost:8765/api/data');
    if(r.ok)return await r.json();
  }catch(e){}
  return null;
}

// 写入服务器
async function writeServer(obj){
  if(!serverMode)return false;
  if(serverSaving)return false;
  serverSaving=true;
  try{
    const r=await fetch('http://localhost:8765/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(obj)
    });
    serverSaving=false;
    return r.ok;
  }catch(e){console.warn('[server] 写入失败',e);serverSaving=false;return false}
}

async function persist(silent){
  // 1. 始终写入 localStorage（快速、离线可用）
  writeLS(DATA);
  
  // 2. 如果连接了服务器，异步写入磁盘
  if(serverMode){
    writeServer(DATA).then(ok=>{
      if(ok)updateStoreInd('server');
      else updateStoreInd('ls');
    });
  }else{
    updateStoreInd('ls');
  }
  
  if(!silent)toast('✓ 已保存');
}

/* ================= 总表：过滤 / 排序 ================= */
function fillFilters(){
  const fs=$('#fStatus');
  if(fs.options.length<=1){STATUSES.forEach(s=>fs.add(new Option(s,s)));fs.add(new Option('已投递/流程中','__active__'))}
  const fp=$('#fPriority');if(fp.options.length<=1)PRI.forEach(p=>fp.add(new Option(p,p)));
}
function filtered(){
  const f=filter;
  let P=flattenPos();
  const q=f.q.trim().toLowerCase();
  if(q)P=P.filter(x=>{
    const r=x.rec,p=x.pos;
    return (r.company+' '+p.title+' '+p.location+' '+p.dept+' '+r.industry+' '+(r.personalNotes||'')+' '+(p.jd||'')).toLowerCase().includes(q);
  });
  if(f.status){if(f.status==='__active__')P=P.filter(x=>inPipelineP(x));else P=P.filter(x=>x.pos.status===f.status)}
  if(f.priority)P=P.filter(x=>x.pos.priority===f.priority);
  if(f.applied)P=P.filter(x=>inPipelineP(x));
  if(f.due)P=P.filter(x=>x.pos.deadline&&daysUntil(x.pos.deadline)<=7&&x.pos.status!=='Offer'&&x.pos.status!=='已拒');
  // sort
  const sk=sortKey, sd=sortDir;
  const val=x=>{const p=x.pos,r=x.rec;
    if(sk==='deadline')return p.deadline?daysUntil(p.deadline):9999;
    if(sk==='match')return p.match==null?-1:p.match;
    if(sk==='priority')return p.priority==='高'?3:p.priority==='中'?2:1;
    if(sk==='updated')return r.updatedAt?+new Date(r.updatedAt):0;
    return String(r.company||'')}
  P.sort((a,b)=>{const x=val(a),y=val(b);if(typeof x==='string')return sd*(x<y?-1:x>y?1:0);return sd*((x>y?1:x<y?-1:0)||(a.rec.company<b.rec.company?-1:1))});
  return P;
}

}

const LS_AI='qf_ai_cfg_v1';
const AI_PRESETS=[
  {n:'DeepSeek',b:'https://api.deepseek.com/v1',m:'deepseek-chat'},
  {n:'通义千问（阿里云）',b:'https://dashscope.aliyuncs.com/compatible-mode/v1',m:'qwen-plus'},

  {n:'硅基流动 SiliconFlow',b:'https://api.siliconflow.cn/v1',m:'Qwen/Qwen2.5-7B-Instruct'},
  {n:'OpenAI',b:'https://api.openai.com/v1',m:'gpt-4o-mini'},
  {n:'自定义 / 本地（Ollama、中转等）',b:'',m:''}
];
function readAI(){try{return JSON.parse(localStorage.getItem(LS_AI)||'null')||{}}catch(e){return {}}}
function writeAI(o){try{localStorage.setItem(LS_AI,JSON.stringify(o||{}))}catch(e){}}
function aiReady(){const c=readAI();return !!(String(c.apiKey||'').trim()&&String(c.baseUrl||'').trim()&&String(c.model||'').trim())}
function normBase(u){u=String(u||'').trim().replace(/\/+$/,'');return u.replace(/\/chat\/completions$/,'')}

async function aiChat(sys,user,temp){
  if(!aiReady())throw new Error('AI_NOT_CONFIGURED');
  const c=readAI();
  const base=normBase(c.baseUrl);
  const model=String(c.model||'').trim();
  const apiKey=String(c.apiKey||'').trim();
  // 构建标准请求体
  const body={model:model,stream:false,temperature:temp==null?0.2:temp,
    messages:[{role:'system',content:sys},{role:'user',content:user}]};

  if(serverMode){
    // 服务器模式：通过本地代理转发，避免 CORS 问题
    console.log('[AI] Using server proxy /api/ai');
    const payload=Object.assign({},body,{_apiKey:apiKey,_baseUrl:base,_model:model});
    try{
      const r=await fetch('/api/ai',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)});
      console.log('[AI] Proxy response status:', r.status);
      if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error('HTTP '+r.status+' · '+t.slice(0,200))}
      const j=await r.json();
      const txt=(j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
      if(!txt)throw new Error('AI 返回为空');
      return String(txt);
    }catch(e){
      console.error('[AI] Proxy fetch error:', e);
      throw e;
    }
  }

  // 非服务器模式：直接请求（仅 localhost 或 https 下可行）
  const url=base+'/chat/completions';
  console.log('[AI] Direct fetch to:', url);
  const ctl=new AbortController();const timer=setTimeout(()=>{console.warn('[AI] Request aborted due to timeout');ctl.abort()},180000);
  try{
    const r=await fetch(url,{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify(body)});
    console.log('[AI] Response status:', r.status, r.statusText);
    if(!r.ok){let t='';try{t=await r.text()}catch(e){}console.error('[AI] Error response:', t);throw new Error('HTTP '+r.status+' · '+t.slice(0,180))}
    const j=await r.json();
    console.log('[AI] Parsed response keys:', Object.keys(j).join(', '));
    const txt=(j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    console.log('[AI] Response text length:', txt.length);
    if(!txt)throw new Error('AI 返回为空');
    return String(txt);
  }catch(e){
    console.error('[AI] Fetch error:', e);
    throw e;
  }finally{clearTimeout(timer)}
}
function aiJSON(txt){
  let s=String(txt||'').trim();
  s=s.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('AI 未返回合法 JSON');
  return JSON.parse(s.slice(a,b+1));
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('脚本加载失败：'+src));document.head.appendChild(s)})}
function readTextFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(new Error('文件读取失败'));r.readAsText(f,'utf-8')})}
let _pdfjsP=null;
function ensurePdfjs(){
  if(_pdfjsP)return _pdfjsP;
  _pdfjsP=(async()=>{
    if(!window.pdfjsLib){
      await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
    }
    if(!window.pdfjsLib)throw new Error('pdf.js 加载失败（可能无网络）');
    if(!window.pdfjsLib.GlobalWorkerOptions.workerSrc){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
    return window.pdfjsLib;
  })().catch(e=>{_pdfjsP=null;throw e});
  return _pdfjsP;
}
async function pdfToText(file){
  const lib=await ensurePdfjs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  const max=Math.min(pdf.numPages||0,25);
  let out=[];
  for(let i=1;i<=max;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    let line='',lastY=null;
    (tc.items||[]).forEach(it=>{
      const y=it.transform&&it.transform[5];
      if(lastY!=null&&y!=null&&Math.abs(y-lastY)>2){out.push(line);line=''}
      line+=(it.str||'');lastY=y==null?lastY:y;
    });
    if(line)out.push(line);
  }
  return out.join('\n');
}
async function docxToText(file){
  if(!window.JSZip)await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  if(!window.JSZip)throw new Error('JSZip 加载失败（可能无网络）');
  const zip=await window.JSZip.loadAsync(file);
  const f=zip.file('word/document.xml');
  if(!f)throw new Error('不是有效的 .docx 文件');
  const xml=await f.async('string');
  const paras=String(xml).split(/<\/w:p>/);
  const lines=paras.map(p=>{
    const m=p.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)||[];
    return m.map(x=>x.replace(/<[^>]+>/g,'')).join('');
  }).filter(x=>x.trim());
  return lines.join('\n');
}
async function fileToText(file){
  const nm=String(file.name||'').toLowerCase();
  if(/\.(txt|md|markdown|csv|log)$/.test(nm))return await readTextFile(file);
  if(/\.pdf$/.test(nm))return await pdfToText(file);
  if(/\.docx$/.test(nm))return await docxToText(file);
  if(/\.doc$/.test(nm))throw new Error('.doc 是旧格式，浏览器无法解析 —— 请另存为 .docx 或 .pdf，或把内容直接粘贴到下方文本框');
  try{return await readTextFile(file)}catch(e){}
  throw new Error('暂不支持的文件类型：'+(file.name||''));
}

/* 浏览器 fetch 网页 → 提取纯文字。遇到 CORS 会尝试公共代理。 */
async function fetchPageText(url){
  /* 先直接 fetch */
  let html=null;
  try{
    const r=await fetch(url,{mode:'cors',headers:{'Accept':'text/html,application/xhtml+xml'}});
    if(r.ok) html=await r.text();
  }catch(_){}
  /* 如果 CORS 失败，尝试公共代理 */
  if(!html){
    try{
      const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
      const r=await fetch(proxy);
      if(r.ok) html=await r.text();
    }catch(_){}
  }
  if(!html) throw new Error('无法访问该链接（浏览器安全策略限制）');
  /* HTML → 纯文字 */
  const doc=new DOMParser().parseFromString(html,'text/html');
  /* 移除无关元素 */
  doc.querySelectorAll('script,style,noscript,svg,nav,footer,header,iframe,.comment,.sidebar').forEach(e=>e.remove());
  const t=(doc.body?doc.body.innerText:doc.documentElement.textContent)||'';
  return t.replace(/\s+/g,' ').trim();
}

/* 示例数据（虚构，仅用于演示） */
function sampleData(){
  // 虚构的月度预算（口径与 build_budget.py 一致：年净储蓄 = 月盈余×12 + 到手×(发薪月数−12)）
  const SAMPLE_SPLIT=[['\u9910\u996e',.55],['\u4ea4\u901a\u901a\u52e4',.12],['\u901a\u8baf\u7f51\u7edc',.05],['\u793e\u4ea4\u5a31\u4e50',.18],['\u65e5\u5e38\u8d2d\u7269',.10]];
  function sampleBudget(city,gross,months,net,rent,living){
    const ex=[{name:'\u623f\u79df\uff08\u5408\u79df\uff09',amount:rent,kind:'fixed'}];
    let acc=0;
    SAMPLE_SPLIT.forEach((s,i)=>{
      const a=(i===SAMPLE_SPLIT.length-1)?(living-acc):Math.round(living*s[1]/100)*100;
      acc+=a; ex.push({name:s[0],amount:a,kind:'living'});
    });
    const tot=ex.reduce((s,e)=>s+e.amount,0), sur=net-tot;
    return {city:city,grossMonthly:gross,months:months,deductionRate:Math.round((1-net/gross)*1000)/1000,
      netMonthly:net,welfareAnnual:0,expenses:ex,totalExpense:tot,surplus:sur,
      annualSurplus:sur*12+net*Math.max(0,months-12),
      surplusRate:Math.round(sur/net*1000)/10,expenseRate:Math.round(tot/net*1000)/10,livingEstimated:true};
  }
  function sampleComp(city,gross,months,net,rent,living){
    const b=sampleBudget(city,gross,months,net,rent,living);
    const S='\u793a\u4f8b\u6570\u636e\uff08\u865a\u6784\uff09';
    return {
      '\u85aa\u8d44\u7ed3\u6784':{text:'\u793a\u4f8b\uff1a\u7a0e\u524d '+gross.toLocaleString()+' \u5143/\u6708\u00d7'+months+'\u85aa\uff0c\u4e94\u9669\u4e00\u91d1\u3002\uff08\u4e3a\u5c55\u793a\u754c\u9762\u6548\u679c\u7f16\u9020\uff09',src:S},
      '\u6708\u5ea6\u9884\u7b97':{text:'\u4ee5'+city+'\u4e3a\u57fa\u51c6\uff1a\u5230\u624b\u6708\u85aa '+net.toLocaleString()+' \u5143 \u2212 \u6708\u652f\u51fa '+tot(b)+' \u5143 = \u6708\u76c8\u4f59 '+b.surplus.toLocaleString()+' \u5143\uff08\u5360\u5230\u624b '+Math.round(b.surplusRate)+'%\uff09\u3002',src:S,budget:b},
      '\u6027\u4ef7\u6bd4':{text:'\u793a\u4f8b\u6570\u636e\uff0c\u4ec5\u7528\u4e8e\u5c55\u793a\u3002\u771f\u5b9e\u6570\u636e\u8bf7\u5728\u300c\u516c\u53f8\u7814\u7a76\u300d\u91cc\u586b\u5199\u6216\u8ba9 AI \u751f\u6210\u3002',src:S},
      '\u8f6c\u6b63\u7387':{text:'\u793a\u4f8b\u6570\u636e\uff0c\u4ec5\u7528\u4e8e\u5c55\u793a\u3002',src:S}
    };
  }
  function tot(b){return b.totalExpense.toLocaleString();}
  const mk=(co,ind,loc,pos,st,mt,comp)=>({id:uid(),company:co,industry:ind,link:'',position:pos.title,location:loc,
    positions:[Object.assign({pid:uid(),location:loc,priority:'中',status:st,applied:st!=='未投递',deadline:'',applyDate:''},pos)],
    research:comp?{report:{compensation:comp}}:{},interviewStages:[],personalNotes:'',priority:'中',status:st,applied:st!=='未投递',updatedAt:nowISO()});
  return {
    records:[
      mk('示例·星河创投','PEVC','上海',{title:'投资分析师（硬科技）',dept:'投资部',salary:'面议',edu:'硕士',match:82},'面试',82,sampleComp('上海',13000,13,10200,4000,2200)),

      mk('示例·华兴证券','券商','深圳',{title:'研究所助理研究员',dept:'研究所',salary:'面议',edu:'硕士',match:55},'网申中',55,sampleComp('深圳',12000,12,9500,4200,2400)),
      mk('示例·国盛金控','银行','北京',{title:'管培生',dept:'总部',salary:'面议',edu:'本科及以上',match:42},'未投递',42,sampleComp('北京',11000,13,8600,4500,2200))

function parseImportText(txt){
  txt=(txt||'').trim();
  if(!txt)return null;
  try{
    let obj;
    if(txt.startsWith('QZ2.'))obj=codeDecode(txt);
    else obj=JSON.parse(txt);
    if(obj&&Array.isArray(obj.records))return normData(obj);
    if(Array.isArray(obj))return normData({records:obj});
    return null;
  }catch(e){return null}
}
function mergeIncoming(incoming){
  if(!incoming)return 0;
  let n=0;const map={};DATA.records.forEach(r=>map[r.id]=r);
  incoming.records.forEach(ir=>{
    if(DATA.deletedIds.includes(ir.id))return;
    const lr=map[ir.id];
    if(!lr){DATA.records.push(ir);n++;return}
    const lu=lr.updatedAt?+new Date(lr.updatedAt):0,iu=ir.updatedAt?+new Date(ir.updatedAt):0;
    if(iu>lu){Object.assign(lr,ir);n++}
  });
  if(incoming.resume&&!DATA.resume)DATA.resume=incoming.resume;
  return n;
}
function importFromText(mode){
  const obj=parseImportText($('#syncIn').value);
  if(!obj){toast('⚠️ 无法解析，请检查粘贴内容是否为同步码或备份 JSON');return}
  if(mode==='replace'){
    if(!confirm('覆盖导入将用导入内容替换本机全部记录，确定？'))return;
    DATA=obj;if(!DATA.deletedIds)DATA.deletedIds=[];
  }else{
    const n=mergeIncoming(obj);toast('🧩 合并完成，新增/更新 '+n+' 条');
  }
  persist();renderAll();$('#syncIn').value='';
  if(mode==='replace')toast('♻️ 已覆盖导入');
  closeSyncIfOpen();
}
function closeSyncIfOpen(){const m=$('#mask-sync');if(m.classList.contains('open')&&!confirm('是否关闭同步窗口？'))return;m.classList.remove('open')}
function resetData(){

function clearAll(){

}

function filterDiscover(){
  const filter=$('#dc-filter').value;
  const minScore=parseInt($('#dc-min-score').value)||0;
  const cards=$$('.discover-card');
  const jobs=DATA.discoveredJobs||[];
  cards.forEach((card)=>{

    card.style.display=(matchType&&matchScore)?'':'none';
  });

  // 风险雷达 - 进度条颜色根据分值自动变化

  function parseBullets(text){

    // 净收入圆环图渲染（替换瀑布图）
  function donutHTML(obj){
    if(!obj) return '';

  // Parse actual monthly salary (not annualized): "月薪Xk" or "Xk×Y薪"

  var gross;

  // Try "月薪Xk" or "底薪Xk" first

  } else {
    // Try "Xk×Y薪" pattern
    var salaryMultMatch = text.match(/([\d,]+)k\s*×\s*(\d+)\s*薪/);
    if(salaryMultMatch){
      gross = parseInt(salaryMultMatch[1].replace(/,/g,'')) * 1000;
    }
  }
  
  // Extract payment months (Y薪)
  var monthsMatch = text.match(/×\s*(\d+)\s*薪/);
  if(monthsMatch){
    months = parseInt(monthsMatch[1]);
  }
  
  if(!gross || gross < 1000) return '';
    
    // Parse deductions from text
    // 社保公积金+个税 (combined or separate)
    var comboMatch = text.match(/扣除[^\d]*(\d+)%[^\d]*净到手约([\d,.]+)万|扣除[^\d]*约(\d+)%[^\d]*净到手约([\d,.]+)万|扣除[^\d]*约(\d+)%[^\d]*净到手约([\d,.]+)/);

    if(comboMatch){

      netMonthly = Math.round(gross * (1 - deductionRate/100));
    } else {
      // Fallback: try "净到手约X万/年" or "净到手约Xk/月"
      var netOnly = text.match(/净到手约([\d,.]+)万/);

    var livingMatch = text.match(/生活费[（(]?[^\d]*[）)]?[：:]\s*([\d,.]+)k|生活费[：:]\s*([\d,.]+)k/);
    var living = livingMatch ? Math.round(parseFloat(livingMatch[1]||livingMatch[2]) * 1000) : Math.round(gross * 0.2);
    
  // Parse net savings: "**净储蓄**：18.9-7.2-4.8=6.9万/年" or "净储蓄：X万/年"

    function metaOf(name){
      var c='#94a3b8', ic='\u2022';
      if(name.indexOf('\u623f\u79df')>=0||name.indexOf('\u623f')>=0){c='#ef4444';ic='\u{1f3e0}';}
      else if(name.indexOf('\u9910\u996e')>=0){c='#f97316';ic='\u{1f35b}';}
      else if(name.indexOf('\u4ea4\u901a')>=0){c='#f59e0b';ic='\u{1f687}';}
      else if(name.indexOf('\u901a\u8baf')>=0){c='#38bdf8';ic='\u{1f4f1}';}
      else if(name.indexOf('\u5a31\u4e50')>=0){c='#a855f7';ic='\u{1f3af}';}
      else if(name.indexOf('\u8d2d\u7269')>=0){c='#14b8a6';ic='\u{1f6d2}';}
      return {c:c,ic:ic};
    }
    function money(v){return (v<0?'-':'')+'\u00a5'+Math.abs(Math.round(v)).toLocaleString();}
    function pctOf(v){return (v/base*100);}

    var segs=[];
    for(var j=0;j<list.length;j++){
      segs.push({name:list[j].name,amount:list[j].amount||0,color:metaOf(list[j].name).c,cls:''});
    }
    if(over) segs.push({name:'\u8d85\u652f',amount:-sur,color:'#dc2626',cls:'hatch'});
    else segs.push({name:'\u6bcf\u6708\u76c8\u4f59',amount:sur,color:'#10b981',cls:''});

    var h='<div class="r-budget">';
    // ---- 顶部三个 KPI ----
    var annual=Math.round((b.grossMonthly||0)*(b.months||12)/1000)/10;
    h+='<div class="rb-kpis">';
    h+='<div class="rb-kpi"><div class="rb-kpi-l">\u7a0e\u524d\u6708\u85aa</div><div class="rb-kpi-v">'+money(b.grossMonthly||0)+'</div><div class="rb-kpi-s">\u00d7'+(b.months||12)+'\u85aa \u00b7 \u5e74\u5305 '+annual+'\u4e07</div></div>';
    h+='<div class="rb-kpi k-net"><div class="rb-kpi-l">\u5230\u624b\u6708\u85aa</div><div class="rb-kpi-v">'+money(net)+'</div><div class="rb-kpi-s">\u5df2\u6263\u793e\u4fdd\u4e2a\u7a0e '+Math.round((b.grossMonthly||0)-net).toLocaleString()+'\uff08'+Math.round((b.deductionRate||0)*100)+'%\uff09</div></div>';
    h+='<div class="rb-kpi k-sur'+(over?' neg':'')+'"><div class="rb-kpi-l">\u6bcf\u6708\u76c8\u4f59</div><div class="rb-kpi-v">'+money(sur)+'</div><div class="rb-kpi-s">\u5360\u5230\u624b '+(net?Math.round(sur/net*100):0)+'%</div></div>';
    h+='</div>';

    // ---- 100% 堆叠条 ----
    h+='<div class="rb-bar-wrap"><div class="rb-bar">';
    for(var k=0;k<segs.length;k++){
      var s=segs[k]; var w=pctOf(s.amount); if(w<0)w=0;
      var lbl=(w>9)?money(s.amount):'';
      h+='<div class="rb-seg '+s.cls+'" style="width:'+w.toFixed(2)+'%;background:'+s.color+'" title="'+esc(s.name)+' '+money(s.amount)+'\uff08'+Math.round(w)+'%\uff09">'+lbl+'</div>';
    }
    h+='</div>';
    if(over) h+='<div class="rb-netline" style="left:'+(net/base*100).toFixed(2)+'%"></div>';
    h+='</div>';
    h+='<div class="rb-scale"><span>0</span><span>\u57fa\u51c6 = \u5230\u624b '+money(net)+' / \u6708</span><span>'+money(base)+'</span></div>';

    // ---- 明细列表 ----
    h+='<div class="rb-list">';
    for(var m=0;m<segs.length;m++){
      var sg=segs[m]; var mt=metaOf(sg.name);
      var isSur=sg.name.indexOf('\u76c8\u4f59')>=0, isOver=sg.name.indexOf('\u8d85\u652f')>=0;
      var rowCls=isSur?' is-sur':(isOver?' is-over':'');
      h+='<div class="rb-row'+rowCls+'">';
      h+='<span class="rb-ic">'+mt.ic+'</span>';
      h+='<span class="rb-nm">'+esc(sg.name)+'</span>';
      h+='<span class="rb-trk"><i style="width:'+Math.min(100,pctOf(sg.amount)).toFixed(2)+'%;background:'+sg.color+'"></i></span>';
      h+='<span class="rb-am">'+money(sg.amount)+'</span>';
      h+='<span class="rb-pc">'+Math.round(pctOf(sg.amount))+'%</span>';
      h+='</div>';
    }
    h+='</div>';

    // ---- 结论 ----
    var sr=net?Math.round(sur/net*100):0;
    if(over){
      h+='<div class="rb-warn">\u26a0\ufe0f \u5165\u4e0d\u6577\u51fa\uff1a\u5230\u624b '+money(net)+' \u4f4e\u4e8e\u6708\u652f\u51fa '+money(exp)+'\uff0c\u6bcf\u6708\u7f3a\u53e3 '+money(-sur)+'\uff0c\u9700\u5bb6\u5ead\u8865\u8d34\u6216\u526f\u4e1a\u652f\u6491\u3002</div>';
    }else if(sr<10){
      h+='<div class="rb-warn">\u26a0\ufe0f \u76c8\u4f59\u7387\u4ec5 '+sr+'%\uff08\u5efa\u8bae\u226520%\uff09\uff0c\u6297\u98ce\u9669\u80fd\u529b\u5f31\uff0c\u4e00\u65e6\u79df\u91d1\u4e0a\u6da8\u6216\u4e34\u65f6\u5f00\u652f\u5c31\u4f1a\u7d27\u5f20\u3002</div>';
    }else if(sr>=25){
      h+='<div class="rb-ok">\u2705 \u76c8\u4f59\u7387 '+sr+'%\uff0c\u73b0\u91d1\u6d41\u5065\u5eb7\uff1b\u623f\u79df\u5360\u5230\u624b '+Math.round((list[0]?list[0].amount:0)/net*100)+'%\uff0c\u5904\u4e8e\u53ef\u627f\u53d7\u8303\u56f4\u3002</div>';
    }

    // ---- 注释 ----
    h+='<div class="rb-foot">';
    if(obj.text) h+=esc(obj.text)+'<br>';
    var bonus=Math.max(0,(b.months||12)-12);
    var bonusTxt=bonus>0?(money(net)+'\u00d7'+bonus):'\uff08\u65e0\u5e74\u7ec8\u5956\uff09';
    if(over){
      h+='\u5e74\u5ea6\u53e3\u5f84\uff1a\u6708\u7f3a\u53e3 '+money(-sur)+'\u00d712 '+(bonus>0?('\u2212 \u5e74\u7ec8\u5956\u7a0e\u540e '+bonusTxt+' '):'')+'\u2192 \u5168\u5e74\u51c0\u73b0\u91d1\u6d41 <b>'+(b.annualSurplus/10000).toFixed(1)+' \u4e07</b>';
    }else{
      h+='\u5e74\u51c0\u50a8\u84c4 \u2248 <b>'+(b.annualSurplus/10000).toFixed(1)+' \u4e07</b> = \u6708\u76c8\u4f59 '+money(sur)+'\u00d712 + \u5e74\u7ec8\u5956\u7a0e\u540e '+bonusTxt;
    }
    if(b.welfareAnnual>0) h+=' + \u798f\u5229\u6298\u7b97 '+(b.welfareAnnual/10000).toFixed(1)+'\u4e07';
    h+='\uff1b\u751f\u6d3b\u8d39\u7ec6\u9879\u4e3a\u6309'+(b.city||'\u5f53\u5730')+'\u5178\u578b\u6d88\u8d39\u7ed3\u6784\u62c6\u5206\u7684\u4f30\u7b97\u503c\uff0c\u623f\u79df\u4e0e\u603b\u989d\u6765\u81ea\u5c97\u4f4d\u85aa\u8d44\u6d4b\u7b97\u3002';
    h+='</div>';
    h+='</div>';
    return h;
  }

  function sectionHTML(title,fields,data,isFull,isWide,collapsible){
    if(!data)data={};
    var cls='r-card';
    if(isFull)cls+=' full';
    if(isWide)cls+=' wide-bg';
    if(collapsible)cls+=' collapsible collapsed';
    var hdrAttr=collapsible?' data-cmd="toggleCard"':'';
    var h='<div class="'+cls+'"><div class="r-card-h"'+hdrAttr+'>'+title+'</div>';
    if(collapsible)h+='<div class="r-card-body">';
    var sources=[];
    var items=[];
    var hasBudget=false;
    for(var i=0;i<fields.length;i++){
      var f=fields[i];var obj=data[f];if(!obj)continue;
      // 月度预算：结构化数据 → 走专用可视化，不再当普通文本渲染
      if(obj && obj.budget){
        hasBudget=true;
        var bsrc=(typeof obj.src==='string'&&obj.src)?obj.src:'\u63a8\u65ad';
        if(sources.indexOf(bsrc)<0)sources.push(bsrc);
        h+='<div class="r-card-item"><div class="fi">\u{1f4b8} \u6708\u5ea6\u9884\u7b97\uff08\u5230\u624b\u53e3\u5f84\uff09</div>'+budgetHTML(obj)+'</div>';
        continue;
      }
      var src=(typeof obj==='string')?'\u63a8\u65ad':obj.src;
      if(src&&sources.indexOf(src)<0)sources.push(src);
      items.push(itemHTML(f,obj));
    }
    if(items.length>0){
      h+='<div class="r-card-items-grid">'+items.join('')+'</div>';
    }
    // 该维度没有任何内容时不渲染空卡片壳
    if(items.length===0 && !hasBudget && !data['\u51c0\u6536\u5165\u8ba1\u7b97']) return '';
    // 无结构化预算数据时，退回旧的净收入圆环图
    if(!data['\u6708\u5ea6\u9884\u7b97'] && data['\u51c0\u6536\u5165\u8ba1\u7b97']){
      h+=donutHTML(data['\u51c0\u6536\u5165\u8ba1\u7b97']);
      var wfSrc=data['\u51c0\u6536\u5165\u8ba1\u7b97'].src;
      if(wfSrc&&sources.indexOf(wfSrc)<0)sources.push(wfSrc);
    }
    if(sources.length)h+='<div class="r-card-src">\u6765\u6e90\uff1a'+sources.join(' / ')+'</div>';
    if(collapsible)h+='</div>';
    return h+'</div>';
  }
  
  // 决策导向顺序：决策 → 匹配度 → 薪资 → 风险 → 岗位 → 公司 → 面试 → 时间线 → 竞品
  var CARDS=[
    {k:'match_analysis',t:'\u{1f3af} \u5339\u914d\u5ea6\u5206\u6790',fs:['\u786c\u5339\u914d','\u8f6f\u5339\u914d','\u9762\u8bd5\u53ef\u884c\u6027']},
    {k:'compensation',t:'\u{1f4b0} \u85aa\u8d44\u4e0e\u4ee3\u4ef7',fs:['\u85aa\u8d44\u7ed3\u6784','\u6708\u5ea6\u9884\u7b97','\u6027\u4ef7\u6bd4','\u8f6c\u6b63\u7387']},
    {k:'risk_radar',t:'\u{26a0}\ufe0f \u98ce\u9669\u96f7\u8fbe',tp:'radar'},
    {k:'position_analysis',t:'\u{1f4bc} \u5c97\u4f4d\u6df1\u5ea6\u62c6\u89e3',fs:['\u771f\u5b9e\u5de5\u4f5c\u5185\u5bb9','\u80fd\u529b\u6210\u957f','\u8df3\u69fd\u8def\u5f84','JD\u8981\u6c42\u9010\u6761\u5bf9\u7167'],collapsible:true},
    {k:'company_profile',t:'\u{1f3e2} \u516c\u53f8\u753b\u50cf',fs:['\u5b9a\u6027','\u4e1a\u52a1\u6a21\u5f0f','\u884c\u4e1a\u5730\u4f4d','\u878d\u8d44/\u80a1\u4e1c'],collapsible:true},
    {k:'interview_info',t:'\u{1f3a4} \u9762\u8bd5\u5b98\u4fe1\u606f',fs:['\u4e00\u9762','\u4e8c\u9762','\u7ec8\u9762'],collapsible:true},
    {k:'timeline',t:'\u{1f4c5} \u79cb\u62db\u65f6\u95f4\u7ebf',fs:['\u7f51\u7533\u622a\u6b62','\u7b14\u8bd5/\u9762\u8bd5\u8282\u594f','\u5f53\u524d\u8fdb\u5ea6','\u5269\u4f59\u5173\u952e\u8282\u70b9'],collapsible:true},
    {k:'competitor_compare',t:'\u{1f4ca} \u6c60\u5185\u5bf9\u6807',fs:['\u6700\u63a5\u8fd1\u76842-3\u4e2a\u673a\u4f1a','\u4f18\u5146\u7ea7','\u673a\u4f1a\u6210\u672c'],wide:true,collapsible:true}
  ];
  
  // 顶部决策摘要大卡 - 从 decision 段提取
  var decisionData=rpt.decision||{};
  var decisionSummary=(decisionData['\u6295\u4e0d\u6295']&&decisionData['\u6295\u4e0d\u6295'].text)||'\u6682\u65e0\u51b3\u7b56\u5efa\u8bae';
  var priority=(decisionData['\u4f18\u5148\u7ea7']&&decisionData['\u4f18\u5148\u7ea7'].text)||'';
  // 根据优先级生成星级
  var stars='\u2605\u2605\u2605\u2605\u2606'; // 默认 4 星
  if(priority.indexOf('1')>=0||priority.indexOf('\u7b2c1')>=0||priority.indexOf('\u9996\u9009')>=0)stars='\u2605\u2605\u2605\u2605\u2605';
  else if(priority.indexOf('2')>=0||priority.indexOf('\u7b2c2')>=0)stars='\u2605\u2605\u2605\u2605\u2606';
  else if(priority.indexOf('3')>=0||priority.indexOf('\u7b2c3')>=0)stars='\u2605\u2605\u2605\u2606\u2606';
  else if(priority.indexOf('4')>=0||priority.indexOf('\u7b2c4')>=0)stars='\u2605\u2605\u2605\u2606\u2606';
  else if(priority.indexOf('5')>=0||priority.indexOf('\u7b2c5')>=0)stars='\u2605\u2605\u2606\u2606\u2606';
  
  var h='<div class="r-report">';
  // 决策摘要头部
  h+='<div class="r-report-hdr">';
  h+='<div class="r-decision-icon">\u2713</div>';
  h+='<div class="r-decision-content">';
  h+='<h3>\u{1f4cb} \u51b3\u7b56\u5efa\u8bae <span class="r-stars">'+stars+'</span></h3>';
  h+='<div class="r-decision-summary">'+esc(decisionSummary)+'</div>';
  h+='</div>';
  h+='<span class="tag">AI \u751f\u6210</span>';
  h+='</div>';
  
  // 主体卡片网格
  h+='<div class="r-rpt-grid">';
  for(var i=0;i<CARDS.length;i++){
    var c=CARDS[i];
    if(c.tp==='radar'){
      h+='<div class="r-card full"><div class="r-card-h">'+c.t+'</div>'+radar(rpt[c.k])+'</div>';
    }else{
      h+=sectionHTML(c.t,c.fs,rpt[c.k],false,c.wide,c.collapsible);
    }
  }
  return h+'</div></div>';
}

function competeBadge(r){
  var ca=r.competitionAnalysis;
  if(!ca||ca.score==null) return '';
  var s=ca.score;
  var label=ca.label||'—';
  var cls=s>=40?'compete-high':s>=20?'compete-mid':'compete-low';
  return '<span class="compete-badge '+cls+'" title="拿offer可能性：'+s+'% '+label+'"><span class="compete-score">'+s+'%</span><span class="compete-label">'+label+'</span></span>';
}
function detailHTML(r){
  const head=`
    <div class="r-back" data-cmd="rsBack">← 返回选择</div>
    <div class="r-head">
      <h2>${esc(r.company)} <span class="r-chip st-${esc(r.status)}">${esc(r.status)}</span>${r.priority?`<span class="r-chip pri-${esc(r.priority)}">${esc(r.priority)}优先</span>`:''} ${competeBadge(r)}</h2>
      <div style="color:var(--tx2);margin-top:6px;font-size:14px">${esc(r.position)}</div>
      <div class="meta-row">
        ${r.location?`<span>📍 ${esc(r.location)}</span>`:''}
        ${r.industry?`<span>🏷 ${esc(r.industry)}</span>`:''}
        ${r.deadline?`<span>⏰ 截止 ${esc(r.deadline)}</span>`:''}
        ${r.applyDate?`<span>📨 已投递 ${esc(r.applyDate)}</span>`:''}
        ${r.matchScore!=null?`<span>🎯 匹配 ${r.matchScore}</span>`:''}
        ${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">🔗 招聘链接</a>`:''}
      </div>
    </div>`;
  const secs=[
    competeSec(r),
    reportSec(r),
    ivSecHTML(r)
  ];
  return `<div class="r-detail">${head}${secs.join('')}</div>`;
}
function ivSecHTML(r){
  const ivs=r.interviewStages||[];
  const rows=ivs.map((s,i)=>`<div class="r-iv-row">
    <div class="ivh">
      <strong>第 ${i+1} 轮</strong>
      <input class="fi" style="max-width:160px" data-iv-field="round" data-idx="${i}" value="${esc(s.round||'')}" placeholder="一面 / 二面 / 技术面">
      <input class="fi" style="max-width:140px" type="date" data-iv-field="date" data-idx="${i}" value="${esc(s.date||'')}">
      <select class="fi" style="max-width:120px" data-iv-field="result" data-idx="${i}">
        <option value="">— 状态 —</option>
        ${['通过','未通过','待定','Offer'].map(x=>`<option ${s.result==x?'selected':''}>${x}</option>`).join('')}
      </select>
      <input class="fi" style="max-width:90px" type="number" min="0" max="100" data-iv-field="score" data-idx="${i}" value="${s.score!=null?s.score:''}" placeholder="评分">
      <button class="ic-btn d" data-cmd="rsDelIv" data-idx="${i}" title="删除本轮">🗑</button>
    </div>
    <div class="fg"><div class="fl">本轮问题</div><textarea class="fi" data-iv-field="notes" data-idx="${i}" placeholder="问了哪些问题、你的回答要点">${esc(s.notes||'')}</textarea></div>
    <div class="fg"><div class="fl">我的表现 & 复盘</div><textarea class="fi" data-iv-field="analysis" data-idx="${i}" placeholder="表现如何、哪里能改进、面试官反应">${esc(s.analysis||'')}</textarea></div>
  </div>`).join('');
  return `<div class="r-sec"><div class="r-sec-h"><span class="ic">🎤</span><span class="ti" style="margin-left:0;font-weight:700;color:var(--tx);font-size:14px">面试记录</span><span class="ti">每轮独立记录 + 复盘（自动保存）</span><div class="btns"><button class="btn primary sm" data-cmd="rsAddIv">＋ 添加一轮</button></div></div>
    <div class="r-sec-b">
      ${rows||`<div class="r-empty-iv">还没有面试轮次。点击右上角添加。</div>`}
    </div></div>`;
}
/* —— 研究页操作 —— */
function rsBack(){curResearchId=null;renderResearchPage()}
function rsAddIv(){
  const r=findRec(curResearchId);if(!r)return;
  if(!r.interviewStages)r.interviewStages=[];
  r.interviewStages.push({round:'',date:'',result:'',score:null,notes:'',analysis:''});
  r.updatedAt=nowISO();persist();renderResearchPage();
}
function rsDelIv(idx){
  const r=findRec(curResearchId);if(!r)return;
  r.interviewStages.splice(idx,1);r.updatedAt=nowISO();persist();renderResearchPage();
}

boot();
</script>
</body>
</html>
